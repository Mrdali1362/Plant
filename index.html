<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TestKit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#fff; --panel:#f2f2f2; --line:#ccc; --soft:#eee; --dark:#212121; --mid:#737373;
    --proto:#e0e0e0; --ok:#2e8a46; --okbg:#e6f5e8; --bad:#c62f2f; --badbg:#fbeaea;
    --blue:#1a4db3; --bluebg:#dbe8ff; --note:#fff2a6;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%}
  body{font-family:Geist,Arial,Helvetica,sans-serif;color:var(--dark);background:var(--bg);font-size:14px}
  #app{height:100%;display:flex;flex-direction:column}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  h1,h2,h3{margin:0}
  a{color:var(--blue)}

  /* Bar */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 24px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;min-height:54px}
  .bar .l,.bar .r{display:flex;align-items:center;gap:14px}
  .logo{font-weight:700;font-size:16px}
  .crumb{color:var(--mid)}
  .tabs{display:flex;gap:4px;margin-left:12px}
  .tab{border:0;background:none;padding:8px 12px;border-radius:6px;font-weight:600;color:var(--mid)}
  .tab.on{background:#fff;color:var(--dark);box-shadow:0 0 0 1px var(--line)}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:13px;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--mid);flex:none}
  .dot.live{background:var(--bad);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.2}}
  .banner{padding:10px 24px;font-size:13px;font-weight:600;display:flex;gap:12px;align-items:center;justify-content:space-between}
  .banner.preview{background:var(--note)}
  .banner.warn{background:var(--badbg);color:var(--bad)}

  /* Buttons */
  .btn{padding:9px 16px;border-radius:999px;border:1px solid var(--dark);background:#fff;color:var(--dark);font-weight:600;white-space:nowrap}
  .btn.primary{background:var(--dark);color:#fff}
  .btn:disabled{opacity:.35;cursor:default}
  .btn.small{padding:6px 12px;font-size:13px}
  .btn.link{border:0;background:none;padding:4px 0;color:var(--mid);text-decoration:underline;font-weight:400}
  .btn.ok{border-color:var(--ok);color:var(--ok)}

  /* Forms */
  .page{flex:1;overflow:auto}
  .col{max-width:900px;margin:0 auto;padding:32px 24px 120px;display:flex;flex-direction:column;gap:20px}
  .col.narrow{max-width:680px}
  .card{border:1px solid var(--line);border-radius:8px;padding:20px;display:flex;flex-direction:column;gap:14px;background:#fff}
  .card.tight{padding:14px;gap:6px}
  .card .head{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .card h3{font-size:16px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field>label,.lbl{font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
  .field input[type=text],.field textarea,.field select,.inp{padding:9px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;width:100%}
  .field textarea{min-height:70px;resize:vertical;line-height:1.4}
  .invalid{border-color:var(--bad)!important}
  .msg{font-size:13px}
  .msg.err{color:var(--bad)}
  .msg.ok{color:var(--ok);font-weight:600}
  .msg.mid{color:var(--mid)}
  .tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:4px;background:var(--panel);color:var(--mid);letter-spacing:.03em}
  .tag.opt{background:var(--bluebg);color:var(--blue)}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .row.end{justify-content:flex-end}
  .row.between{justify-content:space-between}
  .grow{flex:1}
  .toggle{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
  .toggle input{width:18px;height:18px;margin:1px 0 0}
  .toggle small{display:block;color:var(--mid);font-size:12px;margin-top:2px}
  .q{display:flex;gap:8px;align-items:center}
  .q span{font-size:12px;font-weight:600;color:var(--mid);width:24px}
  .sticky{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:14px 24px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .sub{color:var(--mid);margin:0;line-height:1.45}
  .pre{white-space:pre-wrap;line-height:1.5}
  ul.plain{margin:0;padding-left:18px;line-height:1.7}

  /* Participant task */
  .main{flex:1;display:flex;min-height:0}
  .side{width:360px;flex:none;background:var(--panel);padding:28px;display:flex;flex-direction:column;gap:18px;overflow:auto}
  .eyebrow{font-size:13px;font-weight:600;color:var(--mid)}
  .side h1{font-size:22px}
  .side p{font-size:15px;line-height:1.45;margin:0;white-space:pre-wrap}
  .stack{display:flex;flex-direction:column;gap:10px}
  .stack .btn{text-align:left}
  .stage{flex:1;background:var(--proto);position:relative;min-width:0;display:flex;flex-direction:column;align-items:center}
  .reminder{flex:none;margin:16px 0 0;width:min(622px,90%);background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 20px;font-size:13px;color:#484848;text-align:center}
  .protowrap{flex:1;position:relative;width:100%}
  .protowrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .meter{display:flex;gap:3px;align-items:flex-end;height:20px}
  .meter i{width:5px;background:var(--line);border-radius:2px}
  .meter i.on{background:var(--ok)}
  .camprev{width:200px;border-radius:6px;background:#000}
  .big{font-size:30px;font-weight:600;letter-spacing:-.01em}
  /* Task view (chosen design, 20 Nov) */
  .tv{background:#fff}
  .tpanel{width:380px;flex:none;background:#fff;border-right:1px solid #E6E8EC;padding:32px;display:flex;flex-direction:column;gap:20px;overflow:auto}
  .wm{font-size:14px;font-weight:600;color:#8A8F98;margin-bottom:12px}
  .prog{display:flex;flex-direction:column;gap:8px}
  .plabel{font-size:13px;font-weight:600;color:#4361EE}
  .segs{display:flex;gap:6px}
  .segs i{flex:1;height:6px;border-radius:3px;background:#D5DBF5}
  .segs i.on{background:#4361EE}
  .ttext{font-size:24px;line-height:1.12;color:#111827;margin:0;white-space:pre-wrap}
  .recw{display:flex;align-items:center;gap:10px;background:#F5F6F8;border-radius:10px;padding:14px;font-size:13px;font-weight:500;color:#2B2B2B}
  .lvl{display:flex;gap:3px;align-items:center;height:16px}
  .lvl i{width:3px;border-radius:2px;background:#D0D0D0;transition:background .1s}
  .lvl i.on{background:#22A06B}
  .tfoot{border-top:1px solid #E6E8EC;padding-top:20px;display:flex;gap:8px;align-items:center}
  .btn.txt{border:0;background:none;color:#6B665E;font-weight:500;padding:12px}
  .tfoot .btn.primary{flex:1;padding:12px 18px;background:#1F2328;border-color:#1F2328}
  .stage.dark{background:#1C1D21}
  .stage.dark .reminder{width:auto;margin-top:24px;background:#2A2F4A;color:#DCE2FF;border:0;border-radius:999px;padding:8px 14px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
  .stage.dark .protowrap{margin-top:12px}
  /* Create screen (chosen style, 20 Nov) */
  .create{background:#fff}
  .cpanel{width:540px;flex:none;border-right:1px solid #E6E8EC;display:flex;flex-direction:column;min-height:0;background:#fff}
  .cform{flex:1;overflow:auto;padding:28px 32px 32px;display:flex;flex-direction:column;gap:20px}
  .chead{display:flex;align-items:center;gap:12px}
  .ctabs{display:flex;gap:2px;background:#F5F6F8;border-radius:999px;padding:4px}
  .ctabs button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:500;font-size:13px;color:#6B7280}
  .ctabs button.on{background:#fff;color:#111827;font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ctitle{font-size:24px;font-weight:400;line-height:1.12;color:#111827}
  .csub{margin:6px 0 0;color:#6B7280;font-size:13px;line-height:1.5}
  .cfield{display:flex;flex-direction:column;gap:6px}
  .clabel{font-size:13px;font-weight:500;color:#4B5563;display:flex;gap:8px;align-items:center}
  .ctag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;background:#F1F2F4;color:#6B7280;letter-spacing:.03em}
  .ctag.opt{background:#E8ECFD;color:#4361EE}
  .cin{width:100%;background:#F5F6F8;border:1px solid transparent;border-radius:10px;padding:11px 14px;font-size:14px;color:#111827;resize:vertical;line-height:1.45}
  .cin:focus{outline:none;border-color:#4361EE;background:#fff}
  .cin.small{width:auto;padding:7px 10px;font-size:13px}
  .cpanel hr{border:0;border-top:1px solid #E6E8EC;margin:2px 0;width:100%}
  .chips{display:flex;gap:8px}
  .chip2{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:8px 14px;background:#F5F6F8;color:#4B5563;font-weight:500;font-size:13px}
  .chip2 i{width:7px;height:7px;border-radius:50%;background:#C4C8CF}
  .chip2.on{background:#1F2328;color:#fff}
  .chip2.on i{background:#7CE3A5}
  .chint{font-size:12px;color:#9CA3AF}
  .cpreview{margin:0;color:#6B7280;font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .csec{display:flex;align-items:center}
  .csec h2{font-size:15px;font-weight:600}
  .btn.link2{border:0;background:none;padding:4px 0;color:#6B7280;font-weight:500;font-size:13px}
  .btn.link2.blue{color:#4361EE}
  .tcard2{display:flex;flex-direction:column;gap:14px;border:1px solid #E6E8EC;border-radius:12px;padding:16px;background:#fff;text-align:left;width:100%}
  button.tcard2{flex-direction:row;align-items:center;gap:10px;cursor:pointer}
  button.tcard2:hover{border-color:#C9D0F0}
  .tcard2.bad{border-color:var(--bad)}
  .tcard2.open{border:1.5px solid #4361EE}
  .tnum{font-size:13px;font-weight:600;color:#4B5563}
  .tnum.blue{color:#4361EE}
  .tname{font-size:14px;font-weight:500;color:#111827}
  .trow{display:flex;align-items:center;gap:12px}
  .pvpill{font-size:11px;font-weight:600;color:#4361EE;background:#E8ECFD;border-radius:999px;padding:3px 8px}
  .qlist{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .qrow{display:flex;gap:10px;align-items:center;width:100%}
  .qrow>span{font-size:12px;font-weight:600;color:#9CA3AF;width:22px;flex:none}
  .cdisplay{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:#4B5563}
  .cdisplay label{display:flex;gap:6px;align-items:center}
  .cfoot{border-top:1px solid #E6E8EC;padding:14px 24px 14px 20px;display:flex;align-items:center;gap:4px;background:#fff;flex-wrap:wrap}
  .cfmsg{order:-1;flex-basis:100%;padding:0 0 6px 12px}
  .btn.txt.dark{color:#374151}
  .cfoot .btn.primary{padding:11px 18px;background:#1F2328;border-color:#1F2328;margin-left:6px}
  .pvstage{flex:1;min-width:0;background:#121316;display:flex;flex-direction:column;padding:24px 28px;gap:16px}
  .pvtop{display:flex;align-items:center}
  .pvlabel{font-size:13px;font-weight:500;color:#A1A6B0}
  .pvswitch{display:flex;gap:2px;background:#2A2C33;border-radius:999px;padding:4px;overflow:auto;max-width:70%}
  .pvswitch button{border:0;background:none;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:500;color:#A1A6B0;white-space:nowrap}
  .pvswitch button.on{background:#fff;color:#111827}
  .pvholder{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  .pvbox{position:relative;overflow:hidden;border-radius:10px;box-shadow:0 0 0 1px #3D3F46,0 20px 50px rgba(0,0,0,.45)}
  .pvscreen{position:absolute;left:0;top:0;width:1440px;height:900px;transform-origin:0 0;display:flex;flex-direction:column;background:#fff}
  .pvscreen .tpanel{pointer-events:none}
  .pvnote{font-size:12px;color:#7A808C;text-align:center}
  .modal{position:fixed;inset:0;background:rgba(17,19,24,.55);display:flex;align-items:center;justify-content:center;z-index:50}
  .mcard{background:#fff;border-radius:16px;padding:28px;width:min(620px,92vw);display:flex;flex-direction:column;gap:16px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
  a.btn{text-decoration:none;display:inline-block}
  .pvempty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#7A808C;font-size:18px;padding:40px;text-align:center}

  /* Review */
  .drop{border:1.5px dashed var(--mid);border-radius:8px;background:var(--panel);padding:28px;display:flex;gap:16px;align-items:center;justify-content:center;color:var(--mid)}
  .drop.over{background:var(--bluebg);border-color:var(--blue)}
  table{border-collapse:collapse;width:100%}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--soft);font-size:14px;vertical-align:middle}
  th{font-size:12px;color:var(--mid);font-weight:600;background:var(--panel)}
  .tbl{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .chip{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:10px;color:#fff;margin:2px 4px 2px 0;white-space:nowrap}
  .chip.done{background:var(--ok)} .chip.gaveup{background:var(--bad)} .chip.none{background:var(--mid)}
  .detail{flex:1;display:flex;min-height:0}
  .detail .left{flex:1;min-width:0;padding:24px;overflow:auto;display:flex;flex-direction:column;gap:14px}
  .detail .right{width:440px;flex:none;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .player{position:relative;background:#222;border-radius:8px;overflow:hidden}
  .player video.main{width:100%;display:block;max-height:60vh;background:#222}
  .player audio{width:100%;display:block;padding:24px}
  .player video.cam{position:absolute;right:12px;bottom:56px;width:180px;border-radius:6px;border:2px solid #fff;background:#000}
  .tl{position:relative;height:44px;background:var(--panel);border-radius:6px;cursor:pointer}
  .seg{position:absolute;top:8px;height:22px;border-radius:3px;color:#fff;font-size:11px;font-weight:700;padding:4px 6px;overflow:hidden;white-space:nowrap}
  .seg.done{background:var(--ok)} .seg.gaveup{background:var(--bad)} .seg.open{background:var(--mid)}
  .qmark{position:absolute;top:4px;width:2px;height:36px;background:var(--dark)}
  .qmark b{position:absolute;top:-2px;left:4px;font-size:10px}
  .head-play{position:absolute;top:0;width:2px;height:44px;background:var(--bad);pointer-events:none}
  .tcards{display:flex;gap:10px;flex-wrap:wrap}
  .tcard{flex:1;min-width:180px;border:1px solid var(--line);border-radius:8px;padding:12px;cursor:pointer;background:#fff;text-align:left}
  .tcard b{display:block;margin-bottom:4px}
  .rtabs{display:flex;gap:4px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .rbody{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
  .line{display:grid;grid-template-columns:48px 1fr;gap:10px;padding:6px 8px;border-radius:6px;cursor:pointer;line-height:1.4}
  .line:hover{background:var(--panel)}
  .line.cur{background:var(--bluebg)}
  .line .t{color:var(--blue);font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
  mark{background:var(--note)}
  .qa b{display:block;font-size:13px;margin-bottom:4px}
  .qa div{white-space:pre-wrap;line-height:1.45}
  .progress{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
  .progress i{display:block;height:100%;background:var(--dark);width:0}
  .empty{text-align:center;color:var(--mid);padding:40px}
</style>
</head>
<body>
<div id="app"></div>
<script id="testkit-app">
(() => {
"use strict";
// Captured before anything renders, so a participant file can be built from it.
const SOURCE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
const EMBEDDED = (() => { const el = document.getElementById("testkit-test"); if (!el) return null; try { return JSON.parse(el.textContent); } catch { return null; } })();
const APP_TAG = '<script id="testkit-' + 'app">';
const HOSTED = /^https?:$/.test(location.protocol);
const TRANSFORMERS_URL = "https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2";

/* ============================== helpers ============================== */
function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === "value" || k === "checked" || k === "muted" || k === "srcObject") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) { if (c == null || c === false) continue; el.append(c instanceof Node ? c : document.createTextNode(String(c))); }
  return el;
}
const app = document.getElementById("app");
function mount(...nodes) { app.replaceChildren(...nodes.flat().filter(Boolean)); }
const fmt = ms => { const s = Math.max(0, Math.floor(ms / 1000)); return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); };
const slug = s => (s || "test").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "test";
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = h("a", { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function pickFile(accept, multiple) {
  return new Promise(res => {
    const i = h("input", { type: "file", accept, multiple: multiple || null, style: "display:none" });
    i.addEventListener("change", () => { res([...i.files]); i.remove(); });
    document.body.append(i); i.click();
  });
}
function Bar(left, right) {
  return h("div", { class: "bar" }, h("div", { class: "l" }, h("span", { class: "logo" }, "TestKit"), left), h("div", { class: "r" }, right));
}

/* ============================== Figma links ============================== */
function parseFigmaLink(raw) {
  let s = (raw || "").trim();
  if (!s) throw new Error("Paste a Figma link for this task.");
  const m = s.match(/src=["']([^"']+)["']/i);
  if (m) s = m[1];
  s = s.replace(/&amp;/g, "&");
  let u;
  try { u = new URL(s); } catch { throw new Error("That doesn't look like a link. It should start with https://www.figma.com/"); }
  if (u.hostname === "www.figma.com" && u.pathname === "/embed" && u.searchParams.get("url")) return parseFigmaLink(u.searchParams.get("url"));
  if (!/(^|\.)figma\.com$/.test(u.hostname)) throw new Error("This is not a Figma link.");
  const parts = u.pathname.split("/").filter(Boolean);
  const kind = parts[0];
  if (!["proto", "design", "file"].includes(kind)) {
    if (["board", "slides", "make", "deck", "site"].includes(kind)) throw new Error(`This is a Figma ${kind} link. Use a prototype or design file link.`);
    throw new Error("Couldn't find a Figma file in this link.");
  }
  if (parts[1] === "new") throw new Error("This file isn't saved yet. Save it in Figma and copy the link again.");
  let key = parts[1], name = parts[2] || "";
  if (parts[2] === "branch" && parts[3]) { key = parts[3]; name = parts[4] || ""; }
  if (!key || !/^[0-9a-zA-Z]{10,}$/.test(key)) throw new Error("Couldn't read the file key from this link.");
  const keep = {};
  for (const p of ["node-id", "starting-point-node-id", "page-id", "version-id"]) if (u.searchParams.get(p)) keep[p] = u.searchParams.get(p);
  let label = "Figma file";
  try { if (name) label = decodeURIComponent(name).replace(/-/g, " "); } catch {}
  return { key, name, keep, wasDesign: kind !== "proto", label };
}
function embedUrl(link, d) {
  const p = parseFigmaLink(link);
  const q = new URLSearchParams(p.keep);
  q.set("embed-host", "testkit"); q.set("footer", "false");
  q.set("device-frame", String(!!d.frame)); q.set("hotspot-hints", String(!!d.hints));
  q.set("viewport-controls", String(!!d.viewport)); q.set("scaling", d.scaling || "scale-down");
  let nm = ""; try { nm = p.name ? "/" + encodeURIComponent(decodeURIComponent(p.name)) : ""; } catch { nm = ""; }
  return `https://embed.figma.com/proto/${p.key}${nm}?${q}`;

/* ============================== ZIP (store only) ============================== */

}

const Rec = {

  pick(types) { return types.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || ""; },
  start() {

    const vOnly = this.pick(["video/webm;codecs=vp9", "video/webm;codecs=vp8", "video/webm"]);
    const a = this.pick(["audio/webm;codecs=opus", "audio/webm"]);

      add("screen", new MediaStream(tracks), { mimeType: this.mic ? v : vOnly, videoBitsPerSecond: 1500000, audioBitsPerSecond: 64000 });
    }
    if (this.mic) add("audio", new MediaStream(this.mic.getAudioTracks()), { mimeType: a, audioBitsPerSecond: 48000 });
    if (this.cam) add("camera", new MediaStream(this.cam.getVideoTracks()), { mimeType: vOnly, videoBitsPerSecond: 350000 });

  pause() { if (!this.running) return; Object.values(this.recs).forEach(r => { if (r.state === "recording") r.pause(); }); this.active += performance.now() - this.resumedAt; this.running = false; },
  resume() { if (this.running || !this.started) return; Object.values(this.recs).forEach(r => { if (r.state === "paused") r.resume(); }); this.resumedAt = performance.now(); this.running = true; },

  },
  release() { [this.mic, this.screen, this.cam].forEach(s => s && s.getTracks().forEach(t => t.stop())); if (this._ac) { try { this._ac.close(); } catch {} } this._ac = null; this._an = null; },
  reset() { this.release(); Object.assign(this, { mic: null, screen: null, cam: null, recs: {}, chunks: {}, active: 0, resumedAt: 0, running: false, started: false }); }
};

    try {
      const entries = await readZip(f);
      if (!entries["session.json"]) throw new Error("No session data inside.");
      const session = JSON.parse(await entries["session.json"].text());
      if (session.kind !== "testkit-session") throw new Error("Not a TestKit session.");
      R.sessions.push({ id: uid(), fileName: f.name, session, blobs: entries });
    } catch (e) { errs.push(`${f.name}: ${e.message}`); }
  }

}

}
function exportCsv() {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = [["participant", "test", "finished_at", "task", "outcome", "time_seconds", "question", "answer"].join(",")];
  for (const r of R.sessions) {
    const s = r.session;
    for (const t of s.tasks) {
      const base = [s.participant.name || "Anonymous", s.test.name, s.finishedAt, `${t.index + 1}. ${t.title}`, t.outcome || "not reached", t.durationMs != null ? (t.durationMs / 1000).toFixed(1) : ""];
      if (!t.answers.length) lines.push(base.concat(["", ""]).map(q).join(","));
      for (const a of t.answers) lines.push(base.concat([a.q, a.a]).map(q).join(","));
    }
  }
  download(new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv" }), "testkit-answers.csv");
}

function renderDetail(r) {
  const s = r.session, b = r.blobs;
  const dur = Math.max(1, s.durationMs || 1);
  const urls = {};
  for (const k of ["screen.webm", "audio.webm", "camera.webm"]) if (b[k]) urls[k] = URL.createObjectURL(b[k]);
  let main;
  if (urls["screen.webm"]) main = h("video", { class: "main", src: urls["screen.webm"], controls: true, preload: "auto" });
  else if (urls["audio.webm"]) main = h("audio", { src: urls["audio.webm"], controls: true, preload: "auto" });
  const cam = urls["camera.webm"] ? h("video", { class: "cam", src: urls["camera.webm"], muted: true, preload: "auto", playsinline: true }) : null;
  if (cam && !main) { cam.className = "main"; cam.controls = true; main = cam; }
  const fixDuration = m => { m.addEventListener("loadedmetadata", () => { if (m.duration === Infinity) { m.currentTime = 1e101; m.addEventListener("timeupdate", function once() { m.removeEventListener("timeupdate", once); m.currentTime = 0; }); } }); };
  if (main) fixDuration(main);
  if (cam && cam !== main) {
    fixDuration(cam);
    main.addEventListener("play", () => cam.play().catch(() => {}));
    main.addEventListener("pause", () => cam.pause());
    main.addEventListener("ratechange", () => cam.playbackRate = main.playbackRate);
    const sync = () => { if (Math.abs(cam.currentTime - main.currentTime) > 0.3) cam.currentTime = main.currentTime; };
    main.addEventListener("seeked", sync); main.addEventListener("timeupdate", sync);
  }
  const seek = ms => { if (!main) return; main.currentTime = ms / 1000; if (main.paused) main.play().catch(() => {}); };

  // Timeline
  const tl = h("div", { class: "tl", title: "Click to jump" });
  for (const t of s.tasks) {
    if (t.startT == null) continue;
    const end = t.endT ?? dur, left = t.startT / dur * 100, w = Math.max(0.5, (end - t.startT) / dur * 100);
    tl.append(h("div", { class: "seg " + (t.outcome || "open"), style: `left:${left}%;width:${w}%`, title: `${t.title} · ${t.outcome === "done" ? "Done" : t.outcome === "gaveup" ? "Gave up" : ""}` }, `Task ${t.index + 1}`));
    if (t.answers.length && t.endT != null) tl.append(h("div", { class: "qmark", style: `left:${t.endT / dur * 100}%`, title: "Questions (recording paused)" }, h("b", null, "Q")));
  }
  const ph = h("div", { class: "head-play", style: "left:0" });
  tl.append(ph);
  tl.addEventListener("click", e => { const rc = tl.getBoundingClientRect(); seek((e.clientX - rc.left) / rc.width * dur); });
  if (main) main.addEventListener("timeupdate", () => { ph.style.left = Math.min(100, main.currentTime * 1000 / dur * 100) + "%"; highlightLine(main.currentTime); });

  const cards = h("div", { class: "tcards" }, s.tasks.map(t => h("button", { class: "tcard", onclick: () => t.startT != null && seek(t.startT) },
    h("b", null, `Task ${t.index + 1} · ${t.title}`),
    h("span", { class: "chip " + (t.outcome || "none") }, t.outcome === "done" ? "Done" : t.outcome === "gaveup" ? "Gave up" : "Not reached"),
    t.durationMs != null ? h("span", { class: "msg mid" }, " " + fmt(t.durationMs)) : null)));

  // Right panel
  let rtab = r.rtab || (s.transcript ? "transcript" : "answers");
  const body = h("div", { class: "rbody" });
  const tabBtn = (id, label) => h("button", { class: "tab" + (rtab === id ? " on" : ""), onclick: () => { r.rtab = id; renderDetail(r); } }, label);
  let lines = [];
  function highlightLine(sec) {
    let cur = null;
    for (const l of lines) { if (sec >= l.start) cur = l; }
    lines.forEach(l => l.el.classList.toggle("cur", l === cur));
  }
  if (rtab === "answers") {
    for (const t of s.tasks) {
      body.append(h("h3", { style: "font-size:15px;margin-top:4px" }, `Task ${t.index + 1} · ${t.title}`));
      if (!t.answers.length) body.append(h("div", { class: "msg mid" }, "No questions for this task."));
      for (const a of t.answers) body.append(h("div", { class: "qa card tight" }, h("b", null, a.q), h("div", null, a.a.trim() || h("span", { class: "msg mid" }, "No answer"))));
    }
  } else {
    body.append(transcriptPanel(r, seek, ls => { lines = ls; }));
  }

  mount(Bar(h("span", { class: "crumb" }, "Review  ›  " + (s.participant.name || "Anonymous") + "  ·  " + s.test.name),
      h("button", { class: "btn small", onclick: () => { Object.values(urls).forEach(URL.revokeObjectURL); R.current = null; renderReview(); } }, "Back to sessions")),
    h("div", { class: "detail" },
      h("div", { class: "left" },
        h("div", { class: "player" }, main || h("div", { class: "empty", style: "color:#bbb" }, "This session has no recordings."), cam && cam !== main ? cam : null),
        tl,
        h("div", { class: "msg mid" }, "Bars are tasks. Q marks where questions were answered (recording paused). Click the bar to jump."),
        cards),
      h("div", { class: "right" }, h("div", { class: "rtabs" }, tabBtn("transcript", "Transcript"), tabBtn("answers", "Answers")), body)));
}

/* ============================== Transcription ============================== */
const WORKER_SRC = `
let asr = null, loadedKey = null;
self.onmessage = async (e) => {
  const { audio, model, language, url } = e.data;
  try {
    const T = await import(url);
    T.env.allowLocalModels = false;
    try { await caches.open("testkit-probe"); } catch { T.env.useBrowserCache = false; }
    if (!asr || loadedKey !== model) {
      const progress_callback = (p) => self.postMessage({ type: "progress", p: { status: p.status, file: p.file, progress: p.progress, loaded: p.loaded, total: p.total } });
      const tryLoad = (device) => T.pipeline("automatic-speech-recognition", model, {
        device, dtype: device === "webgpu" ? { encoder_model: "fp32", decoder_model_merged: "q4" } : "q8", progress_callback });
      let device = ("gpu" in navigator) ? "webgpu" : "wasm";
      try { asr = await tryLoad(device); }
      catch (err) { if (device !== "webgpu") throw err; device = "wasm"; asr = await tryLoad("wasm"); }
      loadedKey = model;
      self.postMessage({ type: "device", device });
    }
    self.postMessage({ type: "status", text: "Transcribing" });
    const opts = { chunk_length_s: 30, stride_length_s: 5, return_timestamps: true, task: "transcribe" };
    if (language) opts.language = language;
    const out = await asr(audio, opts);
    self.postMessage({ type: "done", chunks: out.chunks || [], text: out.text || "" });
  } catch (err) {
    self.postMessage({ type: "error", message: String((err && err.message) || err) });
  }
};`;
let worker = null;
function getWorker() { if (!worker) worker = new Worker(URL.createObjectURL(new Blob([WORKER_SRC], { type: "text/javascript" }))); return worker; }

async function decodeTo16k(blob) {
  const buf = await blob.arrayBuffer();
  const ac = new AudioContext({ sampleRate: 16000 });
  try {
    const ab = await ac.decodeAudioData(buf);
    if (ab.numberOfChannels === 1) return ab.getChannelData(0).slice();
    const out = new Float32Array(ab.length);
    for (let c = 0; c < ab.numberOfChannels; c++) { const d = ab.getChannelData(c); for (let i = 0; i < d.length; i++) out[i] += d[i] / ab.numberOfChannels; }
    return out;
  } finally { ac.close(); }
}

function transcriptPanel(r, seek, setLines) {
  const s = r.session, wrap = h("div", { class: "stack", style: "gap:12px" });
  const src = r.blobs["audio.webm"] || r.blobs["screen.webm"];
  if (!src) { wrap.append(h("div", { class: "msg mid" }, "No voice was recorded in this session.")); return wrap; }

  if (s.transcript && !r.retranscribe) {
    const search = h("input", { type: "text", class: "inp", placeholder: "Search transcript…" });
    const list = h("div", { class: "stack", style: "gap:2px" });
    const lines = s.transcript.chunks.map(c => {
      const txt = h("span");
      const el = h("div", { class: "line", onclick: () => seek(c.start * 1000) }, h("span", { class: "t" }, fmt(c.start * 1000)), txt);
      return { start: c.start, text: c.text, el, txt };
    });
    const paint = () => {
      const qv = search.value.trim().toLowerCase();
      for (const l of lines) {
        const hit = !qv || l.text.toLowerCase().includes(qv);
        l.el.hidden = !hit;
        l.txt.innerHTML = qv && hit ? esc(l.text).replace(new RegExp(qv.replace(/[.*+?^${}()|[\]\\]/g, "\\$&").replace(/[&<>"]/g, c => esc(c)), "gi"), m => `<mark>${m}</mark>`) : esc(l.text);
      }
    };
    search.addEventListener("input", paint);
    lines.forEach(l => list.append(l.el)); paint(); setLines(lines);
    wrap.append(search, list,
      h("div", { class: "msg mid" }, `${s.transcript.model.split("/").pop()} · ${s.transcript.language || "auto-detected language"} · machine transcript, check quotes against the recording`),
      h("div", { class: "row" },
        r.dirty ? h("button", { class: "btn small primary", onclick: () => saveSessionWithTranscript(r) }, "Save session file with transcript") : h("span", { class: "msg ok" }, "✓ Transcript saved in the session file"),
        h("button", { class: "btn small link", onclick: () => { r.retranscribe = true; renderDetail(r); } }, "Transcribe again")));
    return wrap;
  }

  const model = h("select", { class: "inp" },
    h("option", { value: "onnx-community/whisper-base" }, "Fast (Whisper base, about 80 MB download)"),
    h("option", { value: "onnx-community/whisper-small" }, "More accurate (Whisper small, about 250 MB download)"));
  const lang = h("select", { class: "inp" }, h("option", { value: "" }, "Detect automatically"), h("option", { value: "english" }, "English"), h("option", { value: "swedish" }, "Swedish"));
  const status = h("div", { class: "msg mid" });
  const bar = h("div", { class: "progress", hidden: true }, h("i"));
  const go = h("button", { class: "btn primary" }, "Transcribe");
  go.addEventListener("click", async () => {
    go.disabled = true; model.disabled = true; lang.disabled = true; bar.hidden = false; r.transcribing = true;
    const t0 = performance.now(); let phase = "Preparing audio";
    const tick = setInterval(() => { status.textContent = `${phase}… ${fmt(performance.now() - t0)}`; }, 500);
    try {
      const audio = await decodeTo16k(src);
      phase = "Loading the speech model (first time can take a few minutes)";
      const w = getWorker();
      const result = await new Promise((res, rej) => {
        const files = {};
        w.onmessage = e => {
          const m = e.data;
          if (m.type === "progress" && m.p.status === "progress" && m.p.file) {
            files[m.p.file] = m.p;
            const tot = Object.values(files).reduce((a, f) => a + (f.total || 0), 0), got = Object.values(files).reduce((a, f) => a + (f.loaded || 0), 0);
            if (tot) bar.firstChild.style.width = (got / tot * 100).toFixed(0) + "%";
          } else if (m.type === "device") { phase = "Loading the speech model"; }
          else if (m.type === "status") { phase = `Transcribing ${fmt(audio.length / 16)} of audio (usually takes about as long as the recording)`; bar.firstChild.style.width = "100%"; }
          else if (m.type === "done") res(m);
          else if (m.type === "error") rej(new Error(m.message));
        };
        w.onerror = e => rej(new Error(e.message || "The transcription worker failed to start."));
        w.postMessage({ audio, model: model.value, language: lang.value || null, url: TRANSFORMERS_URL }, [audio.buffer]);
      });
      s.transcript = { model: model.value, language: lang.value || null, createdAt: new Date().toISOString(),
        chunks: result.chunks.map(c => ({ start: c.timestamp[0] ?? 0, end: c.timestamp[1] ?? (c.timestamp[0] ?? 0) + 5, text: (c.text || "").trim() })).filter(c => c.text) };
      r.dirty = true; r.retranscribe = false;
      clearInterval(tick); r.transcribing = false; renderDetail(r);
    } catch (e) {
      clearInterval(tick); r.transcribing = false;
      go.disabled = false; model.disabled = false; lang.disabled = false; bar.hidden = true;
      status.className = "msg err";
      const msg = String(e.message || e);
      status.textContent = /fetch|network|Failed to load|import/i.test(msg)
        ? "Couldn't download the speech model. Check your internet connection. Your network may block cdn.jsdelivr.net or huggingface.co. (" + msg + ")"
        : "Transcription failed: " + msg;
    }
  });
  wrap.append(
    h("p", { class: "sub" }, "Transcription runs on this computer. The audio is not uploaded. The speech model is downloaded the first time."),
    h("div", { class: "field" }, h("label", null, "Model"), model),
    h("div", { class: "field" }, h("label", null, "Language"), lang),
    h("div", null, go), bar, status);
  return wrap;
}
async function saveSessionWithTranscript(r) {
  const files = [{ name: "session.json", blob: new Blob([JSON.stringify(r.session, null, 2)], { type: "application/json" }) }];
  for (const [k, b] of Object.entries(r.blobs)) if (k !== "session.json") files.push({ name: k, blob: b });
  download(await makeZip(files), r.fileName.endsWith(".testkit") ? r.fileName : r.fileName + ".testkit");
  r.dirty = false; renderDetail(r);
}

/* ============================== Boot ============================== */
app.addEventListener("input", () => { const m = document.getElementById("fixmsg"); if (m) m.remove(); });
if (!window.MediaRecorder || !navigator.mediaDevices) {
  mount(Bar(null, null), h("div", { class: "empty" }, h("b", null, "This browser can't record."), h("div", null, "Open this file in Chrome or Edge on a laptop or desktop.")));
} else if (EMBEDDED) {
  startParticipant(normaliseTest(EMBEDDED));
} else if (location.hash.startsWith("#t=")) {
  decodeTest(location.hash.slice(3)).then(t => startParticipant(normaliseTest(t))).catch(() => {
    mount(Bar(null, null), h("div", { class: "empty" }, h("b", null, "This test link is broken or incomplete."), h("div", null, "Ask the person who sent it for a new link. Copy the whole link, including everything after the # sign.")));
  });
} else {
  R.test = loadDraft();
  renderResearcher();
}
})();
</script>
</body>
